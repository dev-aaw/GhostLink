[package]
name = "ghostlink"
version = "2.1.29"
edition = "2021"
description = "GhostLink - High-performance DPI bypass & censorship resilience engine for macOS & Windows"
authors = ["GhostLink Team"]
license = "MIT"

[lib]
name = "ghostlink_engine"
path = "src/lib.rs"

[[bin]]
name = "ghostlink_cli"
path = "src/bin/ghostlink_cli.rs"

[[bin]]
name = "ghostlink_daemon"
path = "src/bin/ghostlink_daemon.rs"

[[bin]]
name = "ghostlink_menubar"
path = "src/bin/ghostlink_menubar.rs"

[[bin]]
name = "ghostlink_tray"
path = "src/bin/ghostlink_tray.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["socks", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.140"
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc = "0.2"
cocoa = "0.26"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
