[package]
name = "ghostlink"
version = "0.1.0"
edition = "2021"
description = "GhostLink - High-performance DPI bypass & censorship resilience engine for macOS & Windows"
authors = ["GhostLink Team"]
license = "MIT"

[lib]
name = "ghostlink_engine"
path = "src/lib.rs"

[[bin]]
name = "ghostlink_cli"
path = "src/bin/ghostlink_cli.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["socks", "stream", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
tempfile = "3.10"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
